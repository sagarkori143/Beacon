[project]
name = "enterprise-agent-runtime"
version = "0.1.0"
description = "Multi-tenant enterprise RAG + agent backend with pluggable LLM, embedding, OCR, storage and queue providers"
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    # web
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "sse-starlette>=2.1.3",
    # config / validation
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "PyYAML>=6.0.2",
    # database
    "SQLAlchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "pgvector>=0.3.6",
    "alembic>=1.14.0",
    # cache / queue
    "redis>=5.2.0",
    # http
    "httpx>=0.27.2",
    # auth
    "PyJWT>=2.10.0",
    "email-validator>=2.2.0",
    # IANA timezone database. Not present on Windows or in slim images, and
    # zoneinfo needs it -- the current_datetime tool resolves a location's
    # timezone at runtime.
    "tzdata>=2024.2",
    "argon2-cffi>=23.1.0",
    # documents
    "PyMuPDF>=1.24.13",
    "pytesseract>=0.3.13",
    "Pillow>=11.0.0",
    # tokenization (approximate, provider-agnostic counter)
    "tiktoken>=0.8.0",
    # observability
    "structlog>=24.4.0",
    "prometheus-client>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.7.4",
    "mypy>=1.13.0",
    "types-PyYAML",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "unit: pure-python tests, no external services",
    "integration: requires PostgreSQL + Redis",
    "e2e: requires the full stack",
    "modelserver: requires a reachable LLM/embedding model server",
    "provider: hits a real third-party provider API (needs credentials)",
]
filterwarnings = ["ignore::DeprecationWarning:passlib.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "C4", "RET", "SIM", "TID"]
ignore = [
    "E501",    # line length handled by formatter
    "B008",    # FastAPI Depends() in defaults is idiomatic
    "S101",    # assert is fine in tests
    # PEP 695 generics are avoided deliberately: the codebase uses explicit
    # TypeVars so generic dataclasses and Protocols read the same way.
    "UP046",
    "UP047",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"migrations/*" = ["E", "F"]
# "token_type" holds the literals "access"/"refresh"; flake8-bandit's
# hardcoded-password heuristic matches the variable name, not a secret.
"app/core/security.py" = ["S105", "S106", "S107"]
"app/core/config.py" = ["S105"]
# `token_type: str = "bearer"` is the OAuth2 token_type field, not a secret.
"app/schemas/auth.py" = ["S105"]
"app/schemas/platform.py" = ["S105"]
# AuditAction members are the *names of recorded events* -- USER_PASSWORD_RESET
# is what happened, not a credential.
"app/core/enums.py" = ["S105"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["migrations/", "tests/"]
