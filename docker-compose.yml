# Local development stack.
#
# Note what is NOT here: Ollama. The model server normally runs on a separate
# machine -- your GPU box, or a dedicated inference host -- and this backend
# reaches it over HTTP at OLLAMA_BASE_URL. Nothing in the code assumes it is
# local, and nothing inspects this machine's hardware.
#
# If you do want a model server alongside the stack for convenience:
#     docker compose --profile local-llm up
# That adds an `ollama` container and points the default URL at it. It is a
# convenience, not a dependency.

name: enterprise-agent

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-agentdb}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-agentdb}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --appendonly yes
      --maxmemory-policy noeviction
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: api
    command: ["alembic", "upgrade", "head"]
    env_file: [.env]
    environment:
      # Migrations connect as the owner; the app connects as app_rw, which
      # cannot bypass RLS. See docker/postgres/init.sql.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-agentdb}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: api
    command:
      ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://app_rw:${APP_DB_PASSWORD:-app_rw}@postgres:5432/${POSTGRES_DB:-agentdb}
      REDIS_URL: redis://redis:6379/0
      STORAGE__LOCAL_PATH: /data/storage
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - storage-data:/data/storage
      - ./config:/app/config:ro
    extra_hosts:
      # Lets OLLAMA_BASE_URL=http://host.docker.internal:11434 reach a model
      # server running on the Docker host. Harmless when it points elsewhere.
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: worker
    command: ["python", "-m", "app.workers.runner"]
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://app_rw:${APP_DB_PASSWORD:-app_rw}@postgres:5432/${POSTGRES_DB:-agentdb}
      REDIS_URL: redis://redis:6379/0
      STORAGE__LOCAL_PATH: /data/storage
    volumes:
      - storage-data:/data/storage
      - ./config:/app/config:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Workers are stateless; scale them independently of the API.
    deploy:
      replicas: ${WORKER_REPLICAS:-1}
    restart: unless-stopped

  # Optional convenience only. Everything works without it when
  # OLLAMA_BASE_URL points at a real model server.
  ollama:
    profiles: ["local-llm"]
    image: ollama/ollama:latest
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  storage-data:
  ollama-models:
